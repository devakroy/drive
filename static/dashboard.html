<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Drive</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{

background:#edf3f4;

display:flex;

height:100vh;

}


/* SIDEBAR */

.sidebar{

width:240px;

background:#6f8f97;

color:white;

padding-top:40px;

}


.logo{

font-size:34px;

text-align:center;

margin-bottom:50px;

}


.menu{

padding-left:30px;

}


.menu div{

padding:18px;

font-size:18px;

cursor:pointer;

transition:.3s;

}


.menu div:hover{

background:rgba(255,255,255,.15);

}



/* MAIN */

.main{

flex:1;

padding:50px;

}



.title{

font-size:45px;

color:#5c7b84;

margin-bottom:30px;

font-weight:600;

}



.upload{

background:white;

padding:50px;

box-shadow:

0 15px 40px rgba(0,0,0,.08);

}


.upload h2{

color:#6f8f97;

margin-bottom:30px;

}



.drop{

border:2px dashed #64d6cf;

padding:70px;

text-align:center;

color:#64d6cf;

font-size:24px;

}



input[type=file]{

margin-top:30px;

font-size:18px;

}



button{

margin-top:25px;

width:200px;

height:55px;

border:none;

background:#64d6cf;

color:white;

font-size:20px;

cursor:pointer;

}



button:hover{

opacity:.9;

}



/* FILE TABLE */

.files{

margin-top:40px;

background:white;

padding:30px;

box-shadow:

0 15px 40px rgba(0,0,0,.08);

}


.files h2{

color:#6f8f97;

margin-bottom:20px;

}


table{

width:100%;

border-collapse:collapse;

}


th{

text-align:left;

padding:18px;

background:#f3f3f3;

color:#6f8f97;

}


td{

padding:18px;

border-bottom:1px solid #eee;

}



</style>

</head>


<body>



<div class="sidebar">


<div class="logo">

☁

</div>


<div class="menu">

<div>Dashboard</div>

<div>My Files</div>

<div>Telegram Storage</div>

<div>Trash</div>

<div>Settings</div>

<div onclick="logout()">Logout</div>

</div>


</div>




<div class="main">


<div class="title">

My Drive

</div>



<div class="upload">


<h2>

Upload Files

</h2>



<div class="drop">

Drag & Drop Files

<br><br>

OR

<br><br>

<input type="file" id="file">

<br>

<button onclick="uploadFile()">

UPLOAD

</button>


</div>


</div>





<div class="files">

<h2>

Recent Files

</h2>


<table>

<tr>

<th>Name</th>

<th>Size</th>

<th>Status</th>

</tr>


<tr>

<td>resume.pdf</td>

<td>1.2 MB</td>

<td>Uploaded</td>

</tr>


<tr>

<td>photo.jpg</td>

<td>3.4 MB</td>

<td>Uploaded</td>

</tr>

</table>

</div>


</div>



<script>


function logout(){

window.location="index.html";

}



async function uploadFile(){

let file=document.getElementById("file").files[0];


if(!file){

alert("Select a file");

return;

}


const fd=new FormData();

fd.append("file",file);


// later


/*

await fetch(

"https://your-render-url/upload",

{

method:"POST",

body:fd

}

);

*/


alert(file.name+" uploaded");



}


</script>


</body>

</html>
