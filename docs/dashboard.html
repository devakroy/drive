<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Drive</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{

background:#edf3f4;

display:flex;

height:100vh;

}


/* SIDEBAR */

.sidebar{

width:240px;

background:#6f8f97;

color:white;

padding-top:40px;

}


.logo{

font-size:34px;

text-align:center;

margin-bottom:50px;

}


.menu{

padding-left:30px;

}


.menu div{

padding:18px;

font-size:18px;

cursor:pointer;

transition:.3s;

}


.menu div:hover{

background:rgba(255,255,255,.15);

}



/* MAIN */

.main{

flex:1;

padding:50px;

}



.title{

font-size:45px;

color:#5c7b84;

margin-bottom:30px;

font-weight:600;

}



.upload{

background:white;

padding:50px;

box-shadow:

0 15px 40px rgba(0,0,0,.08);

}


.upload h2{

color:#6f8f97;

margin-bottom:30px;

}



.drop{

border:2px dashed #64d6cf;

padding:70px;

text-align:center;

color:#64d6cf;

font-size:24px;

}



input[type=file]{

margin-top:30px;

font-size:18px;

}



button{

margin-top:25px;

width:200px;

height:55px;

border:none;

background:#64d6cf;

color:white;

font-size:20px;

cursor:pointer;

}



button:hover{

opacity:.9;

}



/* FILE TABLE */

.files{

margin-top:40px;

background:white;

padding:30px;

box-shadow:

0 15px 40px rgba(0,0,0,.08);

}


.files h2{

color:#6f8f97;

margin-bottom:20px;

}


table{

width:100%;

border-collapse:collapse;

}


th{

text-align:left;

padding:18px;

background:#f3f3f3;

color:#6f8f97;

}


td{

padding:18px;

border-bottom:1px solid #eee;

}



</style>

</head>


<body>



<div class="sidebar">


<div class="logo">

☁

</div>


<div class="menu">

<div>Dashboard</div>

<div>My Files</div>

<div>Telegram Storage</div>

<div>Trash</div>

<div>Settings</div>

<div onclick="logout()">Logout</div>

</div>


</div>




<div class="main">


<div class="title">

My Drive

</div>



<div class="upload">


<h2>

Upload Files

</h2>



<div class="drop">

Drag & Drop Files

<br><br>

OR

<br><br>

<input type="file" id="file">

<br>

<button onclick="uploadFile()">

UPLOAD

</button>


</div>


</div>





<div class="files">

<h2>

Recent Files

</h2>


<table>

<tr>

<th>Name</th>

<th>Size</th>

<th>Status</th>

</tr>


<tr id="files-placeholder">

<td colspan="3">No uploads yet.</td>

</tr>

</table>

</div>


</div>



<script>


function logout(){

window.location="index.html";

}



async function uploadFile(){

let file=document.getElementById("file").files[0];


if(!file){

alert("Select a file");

return;

}


const formData=new FormData();

formData.append("file",file);


try{

const response=await fetch("https://drive-wmwg.onrender.com/upload",{

method:"POST",

body:formData

});

const data=await response.json();

if(response.ok && data.success){

    alert(data.message);
    await loadFileHistory();

}else{

    alert(data.detail || "Upload failed");

}

}catch(error){

alert("Error uploading file");

console.error(error);

}

}


async function loadFileHistory(){
    try{
        const response = await fetch("/files");
        if(!response.ok) throw new Error("Unable to load file history");
        const data = await response.json();
        const table = document.querySelector(".files table");
        const rows = table.querySelectorAll("tr:not(:first-child)");
        rows.forEach(row => row.remove());

        if(!data.files || data.files.length === 0){
            const placeholder = document.createElement("tr");
            placeholder.innerHTML = '<td colspan="3">No uploads yet.</td>';
            table.appendChild(placeholder);
            return;
        }

        data.files.forEach(file => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${file.name}</td>
                <td>${formatFileSize(file.size)}</td>
                <td>${file.status}<br><small>${file.uploaded_at}</small></td>
            `;
            table.appendChild(row);
        });
    }catch(error){
        console.error(error);
    }
}

function formatFileSize(bytes){
    if(bytes < 1024) return bytes + " B";
    const kb = bytes / 1024;
    if(kb < 1024) return kb.toFixed(1) + " KB";
    return (kb / 1024).toFixed(1) + " MB";
}

window.addEventListener("DOMContentLoaded", loadFileHistory);

</script>


</body>

</html>
